[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vakya-companion"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "indic-transliteration>=2.3,<3",
]

[project.optional-dependencies]
provision = ["huggingface-hub>=0.30,<1"]
translation = [
  "torch>=2.6,<2.9",
  "transformers==4.51.3",
  "indictranstoolkit==1.1.1",
  "sentencepiece>=0.2,<0.3",
  "huggingface-hub>=0.30,<1",
]
grammar = ["sanskrit-parser==0.2.6"]
conversation = ["mlx-lm>=0.24,<0.29; platform_system == 'Darwin' and platform_machine == 'arm64'"]
test = ["pytest>=8,<9"]

[project.scripts]
vakya-companion = "vakya_companion.__main__:main"
vakya-models = "vakya_companion.provision:main"

[tool.setuptools.packages.find]
include = ["vakya_companion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
